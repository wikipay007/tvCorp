<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Corporativa</title>
<style>
    :root {
        --bg: #070d16; --card: #0f1923; --borda: #1b2a38;
        --texto: #f2f6fa; --suave: #8fa3b5; --acento: #14d9c4;
        --transicao: 1500ms;
    }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: var(--bg); color: var(--texto); overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    html { font-size: clamp(10px, .8334vw, 40px); } /* 16px em 1920px: tudo escala com a tela */

    #start-screen {
        position: absolute; inset: 0; z-index: 100;
        display: flex; justify-content: center; align-items: center; background: #121212;
    }
    #start-screen button {
        padding: 1.25rem 2.5rem; font-size: 1.5rem; font-weight: bold; color: #fff;
        background: #28a745; border: 4px solid transparent; border-radius: 8px;
        cursor: pointer; transition: background .3s;
    }
    #start-screen button:hover { background: #218838; }
    #start-screen button:focus-visible { outline: none; border-color: #fff; }

    /* ---------- Layout principal ---------- */
    #tv-display {
        display: none; box-sizing: border-box; width: 100vw; height: 100vh;
        padding: .8rem; gap: .8rem;
        grid-template-columns: 1fr 26rem;
        /*cursor: none; 8*/
    }
    #tv-display.on { display: grid; }

    .painel {
        background: var(--card); border: 1px solid var(--borda);
        border-radius: 1.2rem; box-sizing: border-box; min-height: 0; min-width: 0;
    }

    /* ---------- Mídia ---------- */
    #palco { position: relative; overflow: hidden; }
    #media-container { position: absolute; inset: 0; }
    .media-item {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
        opacity: 0; transition: opacity var(--transicao) ease-in-out; will-change: opacity;
    }
    .media-item.active { opacity: 1; }

    #vazio {
        position: absolute; inset: 0; display: none; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
    }
    #vazio.on { display: flex; }
    #vazio h1 { margin: 0 0 .4rem; font-size: 2.6rem; }
    #vazio p { margin: 0; color: var(--suave); font-size: 1.1rem; }

    /* Botão de pular: quase transparente */
    #btn-pular {
        position: absolute; right: 1rem; bottom: 1rem; z-index: 50;
        width: 2.5rem; height: 2.5rem; padding: 0; font-size: 1rem; color: #fff;
        background: rgba(255,255,255,.15); border: 2px solid transparent; border-radius: 50%;
        opacity: .08; cursor: pointer; transition: opacity .3s;
    }
    #btn-pular:hover, #btn-pular:focus-visible { opacity: .7; outline: none; }
    #btn-pular:focus-visible { border-color: #fff; }

    /* ---------- Barra lateral ---------- */
    #lateral { display: flex; flex-direction: column; gap: .8rem; min-height: 0; }
    #lateral .painel { padding: 1.3rem 1.4rem; }

    #relogio { font-size: 4.6rem; font-weight: 800; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
    #data { margin-top: .7rem; font-size: 1.15rem; color: var(--suave); }

    .rotulo {
        display: flex; align-items: center; justify-content: space-between;
        font-size: .95rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--acento);
    }
    .rotulo > span { display: flex; align-items: center; gap: .5rem; }

    #clima-corpo { display: flex; justify-content: space-between; align-items: flex-end; margin-top: .9rem; }
    #clima-temp { font-size: 4.6rem; font-weight: 800; line-height: 1; }
    #clima-desc { margin-top: .5rem; font-size: 1.15rem; }
    #clima-extra { text-align: right; font-size: .95rem; color: var(--suave); line-height: 1.6; }

    #aniv {
        flex: 1; display: flex; flex-direction: column; min-height: 0;
        background: linear-gradient(160deg, #0f1f2b 0%, #0f1923 60%);
    }
    #btn-csv {
        background: none; border: 0; color: var(--acento); font-size: 1rem;
        opacity: .15; cursor: pointer; padding: .2rem .4rem;
    }
    #btn-csv:hover, #btn-csv:focus-visible { opacity: 1; outline: none; }
    #lista-aniv { flex: 1; min-height: 0; overflow: hidden; margin-top: 1rem; }
    .vazio-aniv { color: var(--suave); font-size: 1.05rem; }

    .aniv-item {
        display: flex; align-items: center; gap: .9rem; padding: .55rem .6rem;
        margin-bottom: .45rem; border-radius: .8rem; border: 1px solid transparent;
    }
    .aniv-item.passou { opacity: .5; }
    .aniv-item.hoje { background: rgba(20,217,196,.12); border-color: var(--acento); }
    .aniv-dia {
        flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: #17303a; color: var(--acento); font-weight: 800; font-size: 1.1rem;
    }
    .aniv-item.hoje .aniv-dia { background: var(--acento); color: #04211e; }
    .aniv-nome { font-size: 1.1rem; font-weight: 600; }
    .aniv-setor { font-size: .85rem; color: var(--suave); margin-top: .1rem; }

    @media (prefers-reduced-motion: reduce) { .media-item { transition: none; } }
</style>
</head>
<body>

<div id="start-screen">
    <button id="btn-iniciar" autofocus>▶ Iniciar TV Corporativa</button>
</div>

<div id="tv-display">
    <div id="palco" class="painel">
        <div id="media-container"></div>
        <div id="vazio" class="on">
            <h1>TV Corporativa</h1>
            <p>Nenhuma playlist ativa no momento.</p>
        </div>
        <button id="btn-pular" title="Próximo" aria-label="Próximo item">▶▶</button>
    </div>

    <div id="lateral">
        <div class="painel">
            <div id="relogio">--:--</div>
            <div id="data"></div>
        </div>

        <div class="painel">
            <div class="rotulo"><span><span id="clima-icone">⛅</span><span id="clima-titulo"></span></span></div>
            <div id="clima-corpo">
                <div>
                    <div id="clima-temp">--°</div>
                   <!-- <div id="clima-desc">Carregando…</div> -->
                </div>
                <div id="clima-extra"></div>
            </div>
        </div>

        <div id="aniv" class="painel">
            <div class="rotulo">
                <span><span>🎂</span><span id="aniv-titulo">Aniversariantes</span></span>
                <button id="btn-csv" title="Enviar CSV de aniversariantes (tecla U)">⬆</button>
            </div>
            <div id="lista-aniv"></div>
        </div>
    </div>
</div>

<input type="file" id="arquivo-csv" accept=".csv,.txt,text/csv" style="display:none">

<script src="app.js"></script>
</body>
</html>
